name: RAG Evaluation

# Report-only offline evaluation for retrieval quality (docs/RAG_Evaluation_Plan.md).
# It publishes metrics as a job summary and artifacts; branch protection decides
# whether a workflow failure is permitted to block merges.

on:
  pull_request:
    paths:
      - "backend/app/domain/query_retrieval/**"
      - "backend/app/domain/chat/**"
      - "backend/app/infrastructure/llm/**"
      - "backend/app/infrastructure/vector/**"
      - "backend/requirements.txt"
      - "evals/**"
      - ".github/workflows/rag-eval.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/domain/query_retrieval/**"
      - "backend/app/domain/chat/**"
      - "backend/app/infrastructure/llm/**"
      - "backend/app/infrastructure/vector/**"
      - "backend/requirements.txt"
      - "evals/**"
      - ".github/workflows/rag-eval.yml"
  workflow_dispatch:
    inputs:
      run_dense:
        description: "Run dense, RRF, and reranker baselines (requires GEMINI_API_KEY secret)"
        type: boolean
        default: false
      run_rewrite:
        description: "Run guarded-rewrite baseline with controlled synthetic memory (requires GEMINI_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rag-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sparse-retrieval-eval:
    name: Sparse (BM25) retrieval baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run v0 smoke retrieval baseline
        run: python -m evals.scripts.run_retrieval_eval

      - name: Rebuild and validate v1 golden dataset
        run: |
          python -m evals.scripts.build_rag_v1_expanded_dataset
          python -m evals.scripts.validate_rag_v1_dataset

      - name: Run v1 BM25 retrieval baseline
        run: >
          python -m evals.scripts.run_retrieval_eval
          --cases evals/datasets/northstar_rag_v1.jsonl
          --corpus evals/datasets/northstar_rag_v1_corpus.jsonl
          --output evals/results/northstar_rag_v1_bm25.json

      - name: Publish job summary
        if: always()
        run: |
          for report in evals/results/northstar_rag_v0_smoke_bm25.md evals/results/northstar_rag_v1_bm25.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload sparse evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-sparse-results
          path: |
            evals/results/northstar_rag_v0_smoke_bm25.json
            evals/results/northstar_rag_v0_smoke_bm25.md
            evals/results/northstar_rag_v1_bm25.json
            evals/results/northstar_rag_v1_bm25.md
          retention-days: 30

  dense-retrieval-eval:
    name: Dense (Chroma + Gemini) retrieval baseline
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && (inputs.run_dense == true || inputs.run_rewrite == true))
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dense-evaluation configuration
        run: |
          test -n "$GEMINI_API_KEY" || {
            echo "GEMINI_API_KEY repository or organization secret is required for dense evaluation."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Rebuild and validate v1 golden dataset
        run: |
          python -m evals.scripts.build_rag_v1_expanded_dataset
          python -m evals.scripts.validate_rag_v1_dataset

      - name: Run v1 dense retrieval baseline
        if: github.event_name == 'push' || inputs.run_dense == true
        run: python -m evals.scripts.run_dense_retrieval_eval

      - name: Run v1 RRF retrieval baseline
        if: github.event_name == 'push' || inputs.run_dense == true
        run: python -m evals.scripts.run_hybrid_retrieval_eval --mode rrf

      - name: Run v1 RRF plus reranker baseline
        if: github.event_name == 'push' || inputs.run_dense == true
        run: python -m evals.scripts.run_hybrid_retrieval_eval --mode rerank

      - name: Run v1 guarded-rewrite baseline
        if: github.event_name == 'workflow_dispatch' && inputs.run_rewrite == true
        run: python -m evals.scripts.run_hybrid_retrieval_eval --mode rewrite

      - name: Publish job summary
        if: always()
        run: |
          for report in evals/results/northstar_rag_v1_dense.md evals/results/northstar_rag_v1_rrf.md evals/results/northstar_rag_v1_rerank.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload dense evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-dense-results
          path: |
            evals/results/northstar_rag_v1_dense.json
            evals/results/northstar_rag_v1_dense.md
            evals/results/northstar_rag_v1_rrf.json
            evals/results/northstar_rag_v1_rrf.md
            evals/results/northstar_rag_v1_rerank.json
            evals/results/northstar_rag_v1_rerank.md
            evals/results/northstar_rag_v1_rewrite.json
            evals/results/northstar_rag_v1_rewrite.md
          retention-days: 30
